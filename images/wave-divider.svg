<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -20 1440 140" preserveAspectRatio="none" role="presentation" aria-hidden="true" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- One single wave (one smooth up-down curve, not several) with a soft
       drop shadow hugging its top edge — the shadow reads as the white
       wave sitting slightly above/in front of the hero photo, echoing
       the subtle shadow layer on ChelanCounty.gov's own svg-bg5.png.
       viewBox is padded above 0 (y starts at -20) purely to give the
       shadow's blur room to render without being clipped at the SVG
       canvas edge; the path's own coordinates are unchanged by that. -->
  <defs>
    <filter id="waveShadow" x="-10%" y="-60%" width="120%" height="220%">
      <feDropShadow dx="0" dy="-3" stdDeviation="4" flood-color="#0F2C46" flood-opacity="0.35" />
    </filter>
  </defs>
  <path
    d="M0,50 C 480,110 960,10 1440,50 L1440,120 L0,120 Z"
    fill="#ffffff" filter="url(#waveShadow)" />
</svg>
